<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep Zoom renderer harness (dev only)</title>
<!-- DEV ONLY. Served by the Vite dev server; NOT in vite.config.ts's build inputs.
     The ported renderer (deep-zoom/renderer/core.js) on a full-window canvas with every handle on
     window.__name, for the direct proof (debug/deep-zoom-direct-check.mts), the march bench and the
     historical suites. (The parity smoke that compared it with the historical page went 2026-10-11.)
     ?manual=1  the page steps the renderer itself (autoStart off)      ?embed=0  embed mode off
     The canvas rules below are the historical page's own (#gl and #gl.fit1to1). -->
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font:12px/1.4 monospace; color:#9fe; }
  #gl { display:block; width:100vw; height:100vh; cursor:crosshair; image-rendering:auto; }
  #gl.fit1to1 { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
                width:auto; height:auto; image-rendering:auto; box-shadow:0 0 0 1px #234, 0 0 40px rgba(0,0,0,.85); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script type="module" src="/deep-zoom/renderer/harness.ts"></script>
</body>
</html>
