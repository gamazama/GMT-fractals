<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Curves face</title>
  <style>
/* GE v2 tokens — light-grey scheme snapshot 2026-09-07 (plans/ge-v2-figma/tokens.json).
   Hero mapping as coded in gradient-explorer/v2/WorkingHero.tsx:
   band = raised · card = section · panel = viewport · header = raised. */
body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 13px; color: #111111; background: #D1D1D1; }
a { color: #0893AF; } a:hover { color: #0E7A90; }
.mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
/* Act — 8 px pressable, 26 tall, hairline line/20, section fill */
.act { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: #4B5563; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); white-space: nowrap; }
.act.on { color: #111111; border-color: rgba(17,24,39,0.4); }
.act.accent { color: #0893AF; }
.act.icon { width: 26px; padding: 0; justify-content: center; }
/* the standard GMT slider — label · track · value */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #111111; }
.slider .track { position: relative; height: 8px; border-radius: 4px; background: rgba(17,24,39,0.12); }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #0E7A90; }
.slider .thumb { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
/* the tray — hangs from the card, floats over the wall */
.tray { position: absolute; left: 24px; width: 1232px; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); border-top: 0; border-radius: 0 0 20px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
.tabrow { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; }
.tabrow .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6B7280; }
.tabrow .meta b { color: #4B5563; font-weight: 600; }
.face { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.zone { font-size: 11px; text-transform: uppercase; letter-spacing: 0.025em; color: #4B5563; }
.bar { border-radius: 10px; box-shadow: 0 0 0 1px rgba(17,24,39,0.2); }

  </style>
</helmet>
<div style="position: relative; width: 1232px; height: 360px; background: #B6B6B6"><div class="tray" style="left: 0; top: 0; border-top: 1px solid rgba(17,24,39,0.2)"><div class="tabrow"><div class="act "><span>Mix</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="act "><span>Image</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="act on"><span>Curves</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"></path></svg></div><div class="act "><span>Adjust</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="meta"><span>blend</span><b>Oklab</b><span>output</span><b>Linear</b><div class="act icon" style="height: 22px; width: 22px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"></path></svg></div></div></div>
<div class="face">
  <div style="display: flex; align-items: center; gap: 8px">
    <div class="act "><span>Fit from source</span></div><div class="act "><span>Curves off</span></div><div class="act "><span>Reset</span></div>
    <div style="display: flex; align-items: center; gap: 8px; margin-left: 12px; width: 220px"><span>Detail</span><div class="slider" style="flex: 1"><div class="track"><div class="fill" style="width: 75%"></div><div class="thumb" style="left: calc(75% - 2px)"></div></div></div><span class="mono">8</span></div>
    <div style="display: flex; align-items: center; gap: 8px; width: 220px"><span>Smooth</span><div class="slider" style="flex: 1"><div class="track"><div class="fill" style="width: 50%"></div><div class="thumb" style="left: calc(50% - 2px)"></div></div></div><span class="mono">5</span></div>
    <span style="margin-left: auto; color: #4B5563">Detail and Smooth are the fit recipe; the faint ghost previews a re-fit.</span>
  </div>
  <div style="height: 240px; border-radius: 10px; background: #B6B6B6; position: relative; overflow: hidden">
    <svg width="1200" height="240" viewBox="0 0 1200 240" style="position: absolute; inset: 0" aria-hidden="true">
      <path d="M0 200 C 300 190, 600 60, 1200 40" fill="none" stroke="#FFFFFF" stroke-width="2"></path>
      <path d="M0 140 C 400 150, 700 120, 1200 130" fill="none" stroke="#0E7A90" stroke-width="2"></path>
      <path d="M0 90 C 300 60, 800 180, 1200 100" fill="none" stroke="#D97706" stroke-width="2"></path>
    </svg>
    <div style="position: absolute; left: 12px; top: 10px; display: flex; gap: 12px; font-size: 11px; color: #4B5563"><span style="color: #FFFFFF">L</span><span style="color: #0E7A90">C</span><span style="color: #D97706">h</span></div>
  </div>
</div></div></div>
</x-dc>
</body>
</html>
