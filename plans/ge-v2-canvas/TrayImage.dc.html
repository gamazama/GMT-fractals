<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Image face</title>
  <style>
/* GE v2 tokens — light-grey scheme snapshot 2026-09-07 (plans/ge-v2-figma/tokens.json).
   Hero mapping as coded in gradient-explorer/v2/WorkingHero.tsx:
   band = raised · card = section · panel = viewport · header = raised. */
body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 13px; color: #111111; background: #D1D1D1; }
a { color: #0893AF; } a:hover { color: #0E7A90; }
.mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
/* Act — 8 px pressable, 26 tall, hairline line/20, section fill */
.act { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: #4B5563; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); white-space: nowrap; }
.act.on { color: #111111; border-color: rgba(17,24,39,0.4); }
.act.accent { color: #0893AF; }
.act.icon { width: 26px; padding: 0; justify-content: center; }
/* the standard GMT slider — label · track · value */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #111111; }
.slider .track { position: relative; height: 8px; border-radius: 4px; background: rgba(17,24,39,0.12); }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #0E7A90; }
.slider .thumb { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
/* the tray — hangs from the card, floats over the wall */
.tray { position: absolute; left: 24px; width: 1232px; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); border-top: 0; border-radius: 0 0 20px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
.tabrow { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; }
.tabrow .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6B7280; }
.tabrow .meta b { color: #4B5563; font-weight: 600; }
.face { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.zone { font-size: 11px; text-transform: uppercase; letter-spacing: 0.025em; color: #4B5563; }
.bar { border-radius: 10px; box-shadow: 0 0 0 1px rgba(17,24,39,0.2); }

  </style>
</helmet>
<div style="position: relative; width: 1232px; height: 320px; background: #B6B6B6"><div class="tray" style="left: 0; top: 0; border-top: 1px solid rgba(17,24,39,0.2)"><div class="tabrow"><div class="act "><span>Mix</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="act on"><span>Image</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"></path></svg></div><div class="act "><span>Curves</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="act "><span>Adjust</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></div><div class="meta"><span>blend</span><b>Oklab</b><span>output</span><b>Linear</b><div class="act icon" style="height: 22px; width: 22px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"></path></svg></div></div></div>
<div class="face" style="gap: 12px">
  <div style="display: flex; align-items: center; gap: 6px"><div class="act on accent"><span>Dominant</span></div><div class="act "><span>Tones</span></div><div class="act "><span>Path</span></div><div style="flex: 1"></div><div class="act "><span>Replace image</span></div></div>
  <div style="display: grid; grid-template-columns: 360px minmax(0, 1fr) 240px; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 12px"><div class="slider"><div class="row"><span>Colours</span><span class="mono">6</span></div><div class="track"><div class="fill" style="width: 35%"></div><div class="thumb" style="left: calc(35% - 2px)"></div></div></div><div class="slider"><div class="row"><span>Saliency</span><span class="mono">0.60</span></div><div class="track"><div class="fill" style="width: 60%"></div><div class="thumb" style="left: calc(60% - 2px)"></div></div></div>
      <div style="display: flex; align-items: center; gap: 8px"><span class="zone" style="width: 72px">Dominant</span><div style="flex: 1; display: flex; gap: 4px"><div class="bar" style="flex: 1; height: 22px; background: #2B1B3D"></div><div class="bar" style="flex: 1; height: 22px; background: #5A2E5C"></div><div class="bar" style="flex: 1; height: 22px; background: #9B3F5C"></div><div class="bar" style="flex: 1; height: 22px; background: #C8624F"></div><div class="bar" style="flex: 1; height: 22px; background: #E8925A"></div><div class="bar" style="flex: 1; height: 22px; background: #F2C078"></div></div></div>
    </div>
    <div style="height: 200px; border-radius: 10px; background: linear-gradient(135deg, #8A6A4A, #3A2A2A 60%, #C8A070); position: relative">
      <svg width="100%" height="100%" viewBox="0 0 600 200" preserveAspectRatio="none" style="position: absolute; inset: 0" aria-hidden="true"><path d="M60 150 C 200 40, 380 170, 540 60" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"></path><circle cx="60" cy="150" r="6" fill="#FFFFFF"></circle><circle cx="540" cy="60" r="6" fill="#FFFFFF"></circle></svg>
      <div style="position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px"><div class="act "><span>Draw</span></div><div class="act on accent"><span>Auto</span></div><div class="act "><span>Straight</span></div></div>
    </div>
    <div style="height: 200px; border-radius: 10px; background: #B6B6B6; display: flex; align-items: center; justify-content: center; color: #4B5563">colour cloud</div>
  </div>
</div></div></div>
</x-dc>
</body>
</html>
