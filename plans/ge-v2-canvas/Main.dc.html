/* GE v2 tokens — light-grey scheme snapshot 2026-09-07 (plans/ge-v2-figma/tokens.json).
   Hero mapping as coded in gradient-explorer/v2/WorkingHero.tsx:
   band = raised · card = section · panel = viewport · header = raised. */
body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 13px; color: #111111; background: #D1D1D1; }
a { color: #0893AF; } a:hover { color: #0E7A90; }
.mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
/* Act — 8 px pressable, 26 tall, hairline line/20, section fill */
.act { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: #4B5563; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); white-space: nowrap; }
.act.on { color: #111111; border-color: rgba(17,24,39,0.4); }
.act.accent { color: #0893AF; }
.act.icon { width: 26px; padding: 0; justify-content: center; }
/* the standard GMT slider — label · track · value */
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #111111; }
.slider .track { position: relative; height: 8px; border-radius: 4px; background: rgba(17,24,39,0.12); }
.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #0E7A90; }
.slider .thumb { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
/* the tray — hangs from the card, floats over the wall */
.tray { position: absolute; left: 24px; width: 1232px; background: #C5C5C5; border: 1px solid rgba(17,24,39,0.2); border-top: 0; border-radius: 0 0 20px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
.tabrow { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; }
.tabrow .meta { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #6B7280; }
.tabrow .meta b { color: #4B5563; font-weight: 600; }
.face { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.zone { font-size: 11px; text-transform: uppercase; letter-spacing: 0.025em; color: #4B5563; }
.bar { border-radius: 10px; box-shadow: 0 0 0 1px rgba(17,24,39,0.2); }

  </style>
</helmet>
