    <style>
      html { background-color: #000; scrollbar-width: thin; scrollbar-color: #333 #000; color-scheme: dark; min-height: 100%; overflow-x: clip; }
      /* `overflow-x: clip` (NOT hidden) stops sideways scroll-off without
         turning the root into its own scroll container; `overscroll-behavior:
         none` on both axes kills rubber-band bounce so a touch the canvas
         doesn't consume can't drag the page off an edge. (GE v2 mounts the
         dvh MobileViewportShell — true only since Phase F, 2026-09-10; this
         line claimed it beforehand and was wrong — but no MobileScrollIntro
         spacer, so there is no document scroll to address-bar-collapse and
         these stay purely the off-edge guards. See ADR-0039.) */
      body { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #000; overflow-x: clip; overscroll-behavior: none; }
      /* The DOCUMENT never scrolls on this page, on any pointer. The old shell scoped this
         to fine pointers because app-gmt's MobileScrollIntro needs a scrolling body for its
         address-bar trick; this page mounts no intro, the sticky 100dvh shell IS the page,
         and on a phone the body's leftover scroll was "the screen sliding" under a finger
         on the curves plot (owner, 2026-09-11). */
      html, body { height: 100vh; overflow: hidden; }
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
      .mobile-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
      .mobile-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.25); border-radius: 6px; }
    </style>
